# Olympus fork-only workflow: build oxc_transform_napi (the `oxc-transform` napi binding) for the four
# platforms Owner runs on, verify each binary, and assemble the @owner/oxc-transform package tarball plus
# per-platform archives as workflow artifacts. Publishing them as a GitHub release is a separate manual
# step (see napi/transform/olympus/README.md). No npm publish, no secrets, no upstream workflow changes.
#
# Linux binaries are built with napi-rs' cross toolchain (`--use-napi-cross`), the same path upstream
# uses for its published `@oxc-transform/binding-linux-*-gnu` packages, so they link against an old
# glibc (manylinux2014-era, 2.17) instead of the runner's glibc. A readelf check enforces the ceiling.
name: Olympus transform binding

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - "olympus/**"
    paths:
      - ".github/workflows/olympus-transform-binding.yml"
      - "crates/oxc_transformer_plugins/**"
      - "napi/transform/**"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OLYMPUS_PACKAGE_NAME: "@owner/oxc-transform"
  OLYMPUS_PACKAGE_VERSION: 0.147.0-owner.1
  # Highest GLIBC_x.y symbol version a Linux binary may require. napi-cross targets 2.17; 2.28 leaves
  # headroom for a toolchain bump while still rejecting host-ABI builds (ubuntu-24.04 is 2.39).
  OLYMPUS_MAX_GLIBC: "2.28"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross
            smoke: host
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            build: pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross
            smoke: qemu
          - os: macos-15 # arm64 hosted runner
            target: aarch64-apple-darwin
            platform: darwin-arm64
            build: pnpm build --target aarch64-apple-darwin
            smoke: host
          - os: macos-15-intel # x64 hosted runner; native build and smoke, no Rosetta
            target: x86_64-apple-darwin
            platform: darwin-x64
            build: pnpm build --target x86_64-apple-darwin
            smoke: host
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@d59b270414aa7d0eed947eed4eb5b0b8a675f01d # v1.4.0

      - run: rustup target add ${{ matrix.target }}

      - name: Build
        working-directory: napi/transform
        run: ${{ matrix.build }}
        env:
          TARGET_CC: clang # for mimalloc, same as upstream reusable_release_napi.yml

      - name: Inspect binary
        id: inspect
        working-directory: napi/transform
        run: |
          set -euo pipefail
          bin="transform.${{ matrix.platform }}.node"
          test -f "$bin" || { echo "missing $bin"; ls -la; exit 1; }
          case "${{ matrix.target }}" in
            *-linux-gnu)
              glibc=$(readelf -V "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -t. -k1,1n -k2,2n -u | tail -1 | sed 's/GLIBC_//')
              echo "max glibc symbol version: $glibc (ceiling $OLYMPUS_MAX_GLIBC)"
              highest=$(printf '%s\n%s\n' "$glibc" "$OLYMPUS_MAX_GLIBC" | sort -t. -k1,1n -k2,2n | tail -1)
              [ "$highest" = "$OLYMPUS_MAX_GLIBC" ] || { echo "::error::$bin needs glibc $glibc > $OLYMPUS_MAX_GLIBC; not portable"; exit 1; }
              file "$bin" || true
              ;;
            *-apple-darwin)
              glibc=""
              file "$bin"
              otool -l "$bin" | grep -A3 LC_BUILD_VERSION | sed -n '1,4p' || true
              ;;
          esac
          echo "glibc=$glibc" >> "$GITHUB_OUTPUT"

      - name: Smoke test (host)
        if: matrix.smoke == 'host'
        run: node napi/transform/olympus/smoke.mjs napi/transform/transform.${{ matrix.platform }}.node

      - name: Smoke test (linux arm64 under qemu)
        if: matrix.smoke == 'qemu'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binfmt-support >/dev/null && break || sleep 15; done
          grep -q enabled /proc/sys/fs/binfmt_misc/qemu-aarch64 || { echo "::error::qemu-aarch64 binfmt not registered"; exit 1; }
          for i in 1 2 3; do docker pull --platform linux/arm64 -q node:22-bookworm-slim && break || sleep 15; done
          docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w node:22-bookworm-slim \
            sh -c 'uname -m && node napi/transform/olympus/smoke.mjs napi/transform/transform.${{ matrix.platform }}.node'

      - name: Third-party license texts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        # Full notice text for every crate linked on any shipped target (cargo tree + cargo metadata); fails if a
        # crate's text cannot be resolved. json-escape-simd declares MIT but ships no text anywhere
        # (napi/transform/olympus/license-overrides/SOURCES.txt), so it is the single allowed exception.
        run: |
          set -euo pipefail
          node napi/transform/olympus/third-party-licenses.mjs \
            --out napi/transform/THIRD_PARTY_LICENSES.txt --allow-missing json-escape-simd
          head -6 napi/transform/THIRD_PARTY_LICENSES.txt
          grep -c '^====' napi/transform/THIRD_PARTY_LICENSES.txt

      - name: Write provenance
        working-directory: napi/transform
        run: |
          set -euo pipefail
          bin="transform.${{ matrix.platform }}.node"
          sha=$(shasum -a 256 "$bin" | cut -d' ' -f1)
          mkdir -p ../../olympus-out
          cp "$bin" index.d.ts ../../olympus-out/
          [ -f THIRD_PARTY_LICENSES.txt ] && cp THIRD_PARTY_LICENSES.txt ../../olympus-out/ || true
          cp ../../LICENSE ../../olympus-out/LICENSE
          cp ../../THIRD-PARTY-LICENSE ../../olympus-out/THIRD-PARTY-LICENSE
          cat > "../../olympus-out/BUILD.$bin.json" <<JSON
          {
            "binary": "$bin",
            "sha256": "$sha",
            "target": "${{ matrix.target }}",
            "platform": "${{ matrix.platform }}",
            "sourceSha": "${{ github.sha }}",
            "sourceRef": "${{ github.ref }}",
            "repository": "${{ github.repository }}",
            "runId": "${{ github.run_id }}",
            "oxcBaseTag": "crates_v0.147.0",
            "packageVersion": "$OLYMPUS_PACKAGE_VERSION",
            "rustc": "$(rustc --version)",
            "cargo": "$(cargo --version)",
            "napiCli": "$(pnpm exec napi --version 2>/dev/null | tail -1)",
            "node": "$(node -v)",
            "runner": "${{ runner.os }}-${{ runner.arch }} (${{ matrix.os }})",
            "maxGlibc": "${{ steps.inspect.outputs.glibc }}",
            "smoke": "${{ matrix.smoke }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          (cd ../../olympus-out && shasum -a 256 "$bin" > "$bin.sha256")
          cat "../../olympus-out/BUILD.$bin.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: olympus-oxc-transform-${{ matrix.platform }}
          path: olympus-out/

  assemble:
    name: Assemble package tarball
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@d59b270414aa7d0eed947eed4eb5b0b8a675f01d # v1.4.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: olympus-oxc-transform-*
          path: artifacts

      - name: Assemble package and platform archives
        run: |
          set -euo pipefail
          ver="$OLYMPUS_PACKAGE_VERSION"
          short=$(echo "${{ github.sha }}" | cut -c1-9)
          node napi/transform/olympus/package-binding.mjs \
            --artifacts artifacts --out dist/package --version "$ver" --source-sha "${{ github.sha }}" --release
          node napi/transform/olympus/smoke.mjs dist/package
          mkdir -p bundle
          # npm-style tarball (package/ prefix): installable via a pnpm/npm tarball URL or file: spec
          tar -C dist -czf "bundle/owner-oxc-transform-$ver.tgz" package
          # one archive per platform: binary + provenance + licenses, for consumers that want only the .node
          for dir in artifacts/olympus-oxc-transform-*; do
            plat=${dir##*/olympus-oxc-transform-}
            bin=$(ls "$dir"/transform.*.node)
            tmp=$(mktemp -d)
            cp "$bin" "$dir"/BUILD.*.json "$dir"/*.sha256 "$dir/LICENSE" "$dir/THIRD-PARTY-LICENSE" "$tmp/"
            cp dist/package/THIRD_PARTY_LICENSES.txt "$tmp/"
            tar -C "$tmp" -czf "bundle/oxc-transform-$plat-$ver.tgz" .
            rm -rf "$tmp"
          done
          cp dist/package/BUILD.json "bundle/BUILD.json"
          cp dist/package/SHA256SUMS "bundle/package-SHA256SUMS"
          (cd bundle && shasum -a 256 *.tgz > SHA256SUMS)
          {
            echo "source=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "package=$OLYMPUS_PACKAGE_NAME@$ver"
            echo "tarball=owner-oxc-transform-$ver.tgz"
            echo "sha256=$(shasum -a 256 bundle/owner-oxc-transform-$ver.tgz | cut -d' ' -f1)"
            echo "integrity=sha512-$(openssl dgst -sha512 -binary bundle/owner-oxc-transform-$ver.tgz | openssl base64 -A)"
          } | tee bundle/RELEASE.txt
          cat bundle/SHA256SUMS
          ls -la bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: olympus-oxc-transform-bundle
          path: bundle/
